# 每个"领域包"= 数据源 + 相关性关键词 + 分析师角色/框架 + 推送目标。
# 新增行业/学科：复制一段改即可，无需改代码。
domains:
  semiconductor:
    name: 半导体产业
    schedule: "0 8 * * *"          # 每天 08:00（服务器时区）推送
    channels: [feishu, wecom]
    analyst_role: 资深半导体产业分析师，熟悉晶圆制造、先进封装、设备材料与出口管制
    framework: [供需与产能, 技术路线, 政策与地缘, 竞争格局]
    keywords:                      # 关键词: 权重
      HBM: 3
      先进封装: 3
      CoWoS: 3
      export controls: 3
      TSMC: 2
      台积电: 2
      光刻: 2
      lithography: 2
      foundry: 1
      wafer: 1
    exclude: [giveaway, coupon]
    sources:
      - {type: rss, name: SemiAnalysis-like/EE Times, url: "https://www.eetimes.com/feed/"}
      - {type: rss, name: Tom's Hardware, url: "https://www.tomshardware.com/feeds/all"}
      - {type: arxiv, name: arXiv 硬件架构, query: "cat:cs.AR", max: 15}

  biomedicine:
    name: 生物医药
    schedule: "30 8 * * *"
    channels: [feishu]
    analyst_role: 资深医药行业分析师，关注临床进展、监管审批与 BD 交易
    framework: [临床/研发进展, 监管与审批, 商业化与BD, 风险信号]
    keywords:
      Phase 3: 3
      FDA approval: 3
      GLP-1: 3
      ADC: 2
      CAR-T: 2
      licensing: 2
      clinical trial: 1
    exclude: []
    sources:
      - {type: rss, name: FDA Press Releases, url: "https://www.fda.gov/about-fda/contact-fda/stay-informed/rss-feeds/press-releases/rss.xml"}
      - {type: rss, name: Fierce Biotech, url: "https://www.fiercebiotech.com/rss/xml"}
      - {type: arxiv, name: arXiv 定量生物, query: "cat:q-bio.BM", max: 10}

  ai_research:
    name: AI 学术前沿
    schedule: "0 9 * * 1-5"
    channels: [feishu, wecom]
    analyst_role: 机器学习研究员，擅长快速判断论文的新颖性、可复现性与产业影响
    framework: [核心创新, 证据强度, 可复现性, 产业影响]
    keywords:
      agent: 2
      reasoning: 2
      reinforcement learning: 2
      long context: 2
      diffusion: 1
      benchmark: 1
    exclude: []
    sources:
      - {type: arxiv, name: arXiv cs.CL, query: "cat:cs.CL", max: 25}
      - {type: arxiv, name: arXiv cs.LG, query: "cat:cs.LG", max: 25}
